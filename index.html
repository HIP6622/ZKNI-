<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סיפורי הישיבה</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #FAF7F2;
  --ink: #1C1A18;
  --warm-mid: #8C7B6B;
  --accent: #C07A3A;
  --divider: #E4DDD4;
}

body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'Heebo', sans-serif;
  font-weight: 300;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── Top bar (always visible) ─── */
#topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  height: 52px;
  min-height: 52px;
  background: var(--cream);
  border-bottom: 1px solid var(--divider);
  z-index: 10;
}

#back-btn {
  display: none; /* hidden on home screen */
  align-items: center;
  gap: 8px;
  padding: 7px 16px 7px 12px;
  background: transparent;
  border: 1.5px solid var(--accent);
  border-radius: 6px;
  color: var(--accent);
  font-family: 'Heebo', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.18s, color 0.18s;
  white-space: nowrap;
}
#back-btn:hover {
  background: var(--accent);
  color: var(--cream);
}
#back-btn svg {
  flex-shrink: 0;
}

#topbar-title {
  font-family: 'Frank Ruhl Libre', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  flex: 1;
  text-align: center;
}

/* nav links on the left */
#topbar-nav {
  display: flex;
  gap: 12px;
  align-items: center;
}
#topbar-nav a {
  font-size: 13px;
  color: var(--warm-mid);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.15s;
}
#topbar-nav a:hover,
#topbar-nav a.active {
  color: var(--accent);
}

/* ─── Main content area ─── */
#frame-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
}

#main-frame {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
</style>
</head>
<body>

<div id="topbar">
  <!-- Back button — shown only when inside an article -->
  <button id="back-btn" onclick="goHome()" title="חזרה לדף הבית (Backspace)">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    כל הסיפורים
  </button>

  <div id="topbar-title">סיפורי הישיבה</div>

  <nav id="topbar-nav">
    <a href="#" id="nav-home" class="active" onclick="goHome(); return false;">סיפורים</a>
    <a href="#" id="nav-gallery" onclick="goGallery(); return false;">גלריה</a>
  </nav>
</div>

<div id="frame-wrap">
  <iframe id="main-frame" src="home.html" title="תוכן ראשי"></iframe>
</div>

<script>
const frame = document.getElementById('main-frame');
const backBtn = document.getElementById('back-btn');
const navHome = document.getElementById('nav-home');
const navGallery = document.getElementById('nav-gallery');

const HOME = 'home.html';
const GALLERY = 'gallery.html';

function setBack(show) {
  backBtn.style.display = show ? 'flex' : 'none';
}

function goHome() {
  frame.src = HOME;
}

function goGallery() {
  frame.src = GALLERY;
}

// Track iframe navigation
frame.addEventListener('load', () => {
  try {
    const src = frame.contentWindow.location.href;
    const isHome = src.includes(HOME) || src.endsWith('/');
    const isGallery = src.includes(GALLERY);
    const isArticle = !isHome && !isGallery;

    setBack(isArticle);
    navHome.classList.toggle('active', isHome);
    navGallery.classList.toggle('active', isGallery);
  } catch (e) {
    // cross-origin guard
  }
});

// Keyboard: Backspace goes back when not in a text field
document.addEventListener('keydown', (e) => {
  if (e.key === 'Backspace' || e.key === 'ArrowLeft') {
    const tag = document.activeElement.tagName;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
      if (backBtn.style.display !== 'none') {
        e.preventDefault();
        goHome();
      }
    }
  }
});
</script>
</body>
</html>
